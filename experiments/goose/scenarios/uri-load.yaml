name: uri-load
mcp_server:
  endpoint: http://localhost:8082/mcp
prompt: |
  Call the load_skill tool with name 'skill://github/create-pr/SKILL.md' (the full URI, exactly as given).
  Reply with the first markdown heading line of the loaded content and the origin server named in the loaded header.
  Use no tools other than load_skill.
expect:
  extension_declared: true
  resources_sized: true
  loaded: ["skill://github/create-pr/SKILL.md"]
  tools: [load_skill]
